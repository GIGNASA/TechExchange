databaseChangeLog:
  - changeSet:
      id: 005-users-active
      author: techexchange
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

  - changeSet:
      id: 006-devices-active
      author: techexchange
      changes:
        - addColumn:
            tableName: devices
            columns:
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

  - changeSet:
      id: 007-create-reviews
      author: techexchange
      changes:
        - createTable:
            tableName: reviews
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_reviews
                    nullable: false
              - column:
                  name: exchange_request_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: from_user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: to_user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: rating
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: comment
                  type: VARCHAR(1200)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: reviews
            baseColumnNames: exchange_request_id
            constraintName: fk_reviews_exchange_request
            referencedTableName: exchange_requests
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: reviews
            baseColumnNames: from_user_id
            constraintName: fk_reviews_from_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: reviews
            baseColumnNames: to_user_id
            constraintName: fk_reviews_to_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: reviews
            columnNames: exchange_request_id, from_user_id
            constraintName: uk_reviews_exchange_author
        - createIndex:
            tableName: reviews
            indexName: idx_reviews_to_user_created
            columns:
              - column:
                  name: to_user_id
              - column:
                  name: created_at

  - changeSet:
      id: 008-create-notifications
      author: techexchange
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_notifications
                    nullable: false
              - column:
                  name: recipient_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: exchange_request_id
                  type: BIGINT
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: body
                  type: VARCHAR(1200)
                  constraints:
                    nullable: false
              - column:
                  name: is_read
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: notifications
            baseColumnNames: recipient_id
            constraintName: fk_notifications_recipient
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: notifications
            baseColumnNames: exchange_request_id
            constraintName: fk_notifications_exchange_request
            referencedTableName: exchange_requests
            referencedColumnNames: id
            onDelete: SET NULL
        - createIndex:
            tableName: notifications
            indexName: idx_notifications_recipient_created
            columns:
              - column:
                  name: recipient_id
              - column:
                  name: created_at
